name: Update portfolio stats

# Recounts entries in each folder (ignoring TEMPLATE.md / README.md) and
# writes the totals into README.md and docs/index.html, then commits.
# Runs after any push to main that isn't itself a stats-bot commit.

on:
  push:
    branches: [main]
    paths:
      - "writeups/**"
      - "certifications/**"
      - "projects/**"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    if: github.event.head_commit.author.name != 'stats-bot'
    steps:
      - uses: actions/checkout@v4

      - name: Count entries
        id: count
        run: |
          count_md() {
            find "$1" -maxdepth 1 -name "*.md" ! -name "README.md" ! -name "TEMPLATE.md" 2>/dev/null | wc -l
          }
          MACHINES=$(count_md "writeups/htb-machines")
          CHALLENGES=$(count_md "writeups/htb-challenges")
          CERTS=$(count_md "certifications")
          PROJECTS=$(count_md "projects")
          echo "machines=$MACHINES" >> "$GITHUB_OUTPUT"
          echo "challenges=$CHALLENGES" >> "$GITHUB_OUTPUT"
          echo "certs=$CERTS" >> "$GITHUB_OUTPUT"
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"

      - name: Update README.md stats table
        run: |
          python3 - <<'EOF'
          import re

          with open("README.md") as f:
              content = f.read()

          table = """| Category | Count |
          |---|---|
          | HTB Machines | ${{ steps.count.outputs.machines }} |
          | HTB Challenges | ${{ steps.count.outputs.challenges }} |
          | Certifications | ${{ steps.count.outputs.certs }} |
          | Projects | ${{ steps.count.outputs.projects }} |"""

          new_content = re.sub(
              r"<!-- STATS:START -->.*<!-- STATS:END -->",
              f"<!-- STATS:START -->\n{table}\n<!-- STATS:END -->",
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w") as f:
              f.write(new_content)
          EOF

      - name: Update docs/index.html status strip
        run: |
          python3 - <<'EOF'
          import re

          with open("docs/index.html") as f:
              html = f.read()

          values = [
              "${{ steps.count.outputs.machines }}",
              "${{ steps.count.outputs.challenges }}",
              "${{ steps.count.outputs.certs }}",
              "${{ steps.count.outputs.projects }}",
          ]

          parts = html.split('<span class="num">')
          rebuilt = parts[0]
          for i, part in enumerate(parts[1:]):
              rest = part.split("</span>", 1)[1]
              val = values[i] if i < len(values) else "00"
              rebuilt += f'<span class="num">{val.zfill(2)}</span>' + rest

          with open("docs/index.html", "w") as f:
              f.write(rebuilt)
          EOF

      - name: Commit changes
        run: |
          git config user.name "stats-bot"
          git config user.email "actions@github.com"
          git add README.md docs/index.html
          git diff --cached --quiet || git commit -m "chore: auto-update portfolio stats"
          git push
